name: Build AOSP / LineageOS Recovery

on:
  push:
    branches:
      - aosp
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'LineageOS manifest branch:'
        required: true
        default: 'lineage-21.0'
      BUILD_TARGET:
        description: 'Make target:'
        required: true
        type: choice
        default: 'vendorbootimage'
        options:
          - 'vendorbootimage'
          - 'recoveryimage'
          - 'both'
      BUILD_TYPE:
        description: 'Build variant:'
        required: true
        type: choice
        default: 'eng'
        options:
          - 'eng'
          - 'userdebug'

jobs:
  build:
    name: Build AOSP Recovery for Lenovo TB311FU
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unused preinstalled packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Check out Device Recovery Tree
        uses: actions/checkout@v4
        with:
          path: tb311fu_recovery_tree

      - name: Set up Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            python3-pip python-is-python3 rsync lz4 ccache bc cpio libssl-dev libelf-dev

          # Install Google repo CLI
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

          # Git identity
          git config --global user.name "BangerSoul-CI"
          git config --global user.email "ci@bangersoul.dev"
          git config --global color.ui false

      - name: Initialize LineageOS / AOSP Manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/recovery_workspace"
          cd "$GITHUB_WORKSPACE/recovery_workspace"

          BRANCH="${{ inputs.MANIFEST_BRANCH || 'lineage-21.0' }}"
          echo "Initializing LineageOS minimal recovery manifest ($BRANCH)..."
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune

      - name: Link TB311FU Recovery Device Tree
        run: |
          TARGET_DIR="$GITHUB_WORKSPACE/recovery_workspace/device/lenovo/TB311FU"
          mkdir -p "$TARGET_DIR"
          rsync -av --exclude='.git' --exclude='.github' --exclude='tb311fu_recovery_tree' "$GITHUB_WORKSPACE/tb311fu_recovery_tree/" "$TARGET_DIR/"
          echo "=== Device tree populated at $TARGET_DIR ==="
          ls -la "$TARGET_DIR"

      - name: Compile AOSP Recovery Image
        run: |
          cd "$GITHUB_WORKSPACE/recovery_workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export TW_THEME="portrait_hdpi"
          export TARGET_SCREEN_WIDTH=1200
          export TARGET_SCREEN_HEIGHT=1920
          export DEVICE_SCREEN_WIDTH=1200
          export DEVICE_SCREEN_HEIGHT=1920
          source build/envsetup.sh

          TYPE="${{ inputs.BUILD_TYPE || 'eng' }}"
          TARGET="${{ inputs.BUILD_TARGET || 'vendorbootimage' }}"

          lunch "lineage_TB311FU-${TYPE}" || lunch "omni_TB311FU-${TYPE}" || lunch "twrp_TB311FU-${TYPE}"

          # Fix rsync root/vendor conflict in recovery ramdisk packaging:
          grep -rl "rsync -a --exclude=sdcard" build/ 2>/dev/null | xargs -r sed -i 's/rsync -a --exclude=sdcard/rsync -a --exclude=vendor --exclude=\/root\/vendor --exclude=sdcard/g'

          # Ensure prebuilt DTB is pre-staged in out directory for ninja dependency resolution
          mkdir -p out/target/product/TB311FU
          mkdir -p out/target/product/TB311FU/vendor_ramdisk
          cp -f device/lenovo/TB311FU/prebuilt/dtb.img out/target/product/TB311FU/dtb.img || true

          if [ "$TARGET" = "both" ]; then
            mka adbd vendorbootimage recoveryimage -j$(nproc --all) || mka adbd recoveryimage -j$(nproc --all)
          else
            mka adbd "$TARGET" -j$(nproc --all) || mka adbd recoveryimage -j$(nproc --all)
          fi

      - name: Inspect & Package Output Artifacts
        id: package
        run: |
          cd "$GITHUB_WORKSPACE/recovery_workspace"
          OUT_DIR="$GITHUB_WORKSPACE/recovery_workspace/out/target/product/TB311FU"
          TREE_DIR="$GITHUB_WORKSPACE/tb311fu_recovery_tree"
          RELEASE_DIR="$GITHUB_WORKSPACE/release_artifacts"
          mkdir -p "$RELEASE_DIR"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          echo "=== Locating Recovery Ramdisk and DTB ==="
          RECOVERY_RAMDISK=""
          if [ -f "$OUT_DIR/ramdisk-recovery.cpio.lz4" ] && [ -s "$OUT_DIR/ramdisk-recovery.cpio.lz4" ]; then
            RECOVERY_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.lz4"
          elif [ -f "$OUT_DIR/ramdisk-recovery.cpio.gz" ] && [ -s "$OUT_DIR/ramdisk-recovery.cpio.gz" ]; then
            gzip -dc "$OUT_DIR/ramdisk-recovery.cpio.gz" | lz4 -l -9 -f > "$OUT_DIR/ramdisk-recovery.cpio.lz4"
            RECOVERY_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.lz4"
          elif [ -f "$OUT_DIR/ramdisk-recovery.cpio" ] && [ -s "$OUT_DIR/ramdisk-recovery.cpio" ]; then
            lz4 -l -9 -f "$OUT_DIR/ramdisk-recovery.cpio" "$OUT_DIR/ramdisk-recovery.cpio.lz4"
            RECOVERY_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.lz4"
          elif [ -d "$OUT_DIR/recovery/root" ]; then
            MKBOOTFS=$(find out/host -type f -name "mkbootfs" 2>/dev/null | head -n 1)
            if [ -z "$MKBOOTFS" ]; then
              MKBOOTFS=$(find . -type f -name "mkbootfs" 2>/dev/null | head -n 1)
            fi
            if [ -n "$MKBOOTFS" ] && [ -x "$MKBOOTFS" ]; then
              "$MKBOOTFS" "$OUT_DIR/recovery/root" | lz4 -l -9 -f > "$OUT_DIR/ramdisk-recovery.cpio.lz4"
              RECOVERY_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.lz4"
            else
              echo "Using native cpio + lz4 fallback for recovery ramdisk packaging..."
              (cd "$OUT_DIR/recovery/root" && find . | cpio -o -H newc) | lz4 -l -9 -f > "$OUT_DIR/ramdisk-recovery.cpio.lz4"
              RECOVERY_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.lz4"
            fi
          fi

          DTB_PATH="$OUT_DIR/dtb.img"
          if [ ! -f "$DTB_PATH" ]; then
            DTB_PATH="$TREE_DIR/prebuilt/dtb.img"
          fi

          PLATFORM_RAMDISK="$TREE_DIR/prebuilt/platform_vendor_ramdisk.lz4"

          echo "Assembling turnkey hybrid vendor_boot with stock MTK platform modules..."
          if [ -n "$RECOVERY_RAMDISK" ] && [ -s "$RECOVERY_RAMDISK" ] && [ -f "$PLATFORM_RAMDISK" ] && [ -f "$DTB_PATH" ]; then
            RSIZE=$(stat -c%s "$RECOVERY_RAMDISK")
            echo "Recovery ramdisk size: $RSIZE bytes"
            if [ "$RSIZE" -gt 100000 ]; then
              python3 "$TREE_DIR/tools/repack_v4.py" \
                --output "$OUT_DIR/vendor_boot.img" \
                --platform "$PLATFORM_RAMDISK" \
                --recovery "$RECOVERY_RAMDISK" \
                --dtb "$DTB_PATH" \
                --cmdline "bootopt=64S3,32N2,64N2 buildvariant=eng"
            else
              echo "Warning: Recovery ramdisk is small ($RSIZE bytes)"
            fi
          fi

          # Ensure vendor_boot.img is present in release dir
          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            VSIZE=$(stat -c%s "$OUT_DIR/vendor_boot.img")
            echo "Final vendor_boot.img size: $VSIZE bytes"
            cp -f "$OUT_DIR/vendor_boot.img" "$RELEASE_DIR/vendor_boot.img"
            cp -f "$OUT_DIR/vendor_boot.img" "$RELEASE_DIR/AOSP-TB311FU-vendor_boot-${TIMESTAMP}.img"
          fi

          # Ensure recovery.img is present in release dir
          if [ -f "$OUT_DIR/recovery.img" ]; then
            cp -f "$OUT_DIR/recovery.img" "$RELEASE_DIR/recovery.img"
            cp -f "$OUT_DIR/recovery.img" "$RELEASE_DIR/AOSP-TB311FU-recovery-${TIMESTAMP}.img"
          elif [ -f "$OUT_DIR/boot.img" ]; then
            cp -f "$OUT_DIR/boot.img" "$RELEASE_DIR/recovery.img"
            cp -f "$OUT_DIR/boot.img" "$RELEASE_DIR/AOSP-TB311FU-recovery-${TIMESTAMP}.img"
          elif [ -f "$RELEASE_DIR/vendor_boot.img" ]; then
            cp -f "$RELEASE_DIR/vendor_boot.img" "$RELEASE_DIR/recovery.img"
          fi

          # Compute SHA256SUMS and SHA256SUMS.txt
          cd "$RELEASE_DIR"
          sha256sum recovery.img vendor_boot.img > SHA256SUMS
          cp -f SHA256SUMS SHA256SUMS.txt

          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "=== Release Artifacts Prepared ==="
          ls -la "$RELEASE_DIR"
          cat SHA256SUMS

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AOSP-TB311FU-${{ steps.package.outputs.TIMESTAMP }}
          path: release_artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/aosp'
        with:
          tag_name: release-${{ steps.package.outputs.TIMESTAMP }}
          name: "AOSP / LineageOS Recovery for Lenovo Tab M11 (TB311FU) - ${{ steps.package.outputs.TIMESTAMP }}"
          draft: false
          prerelease: false
          files: |
            release_artifacts/recovery.img
            release_artifacts/vendor_boot.img
            release_artifacts/SHA256SUMS
            release_artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
